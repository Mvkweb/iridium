name: Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
        
    - name: Restore dependencies
      run: dotnet restore Iridium.csproj
      
    - name: Build
      run: dotnet build Iridium.csproj -c Release --no-restore
